<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <section id="login" hidden>
    <h1>Sign in</h1>
    <input id="username" placeholder="Username" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
  </section>

  <section id="main" hidden>
    <div class="bar">
      <button id="analyzeBtn">Send this job posting</button>
      <button id="clearBtn" class="ghost">Clear done</button>
      <button id="logoutBtn" class="ghost">Sign out</button>
    </div>
    <ul id="jobs"></ul>
  </section>

  <p id="error" role="alert"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
