name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          API_BASE: ${{ vars.API_BASE }}
      - run: cd dist && zip -r ../tip-job-posting-analyzer-${{ github.ref_name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: tip-job-posting-analyzer-${{ github.ref_name }}.zip